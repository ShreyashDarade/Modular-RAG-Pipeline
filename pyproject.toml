[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "turinton-rag"
version = "2.0.0"
description = "Modular, horizontally scalable RAG: multi-format ingestion with OCR, selective multi-collection hybrid retrieval, multi-model chat, MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{name = "Turinton AI", email = "support@turinton.ai"}]
keywords = ["rag", "ocr", "elasticsearch", "openai", "mcp", "fastapi", "multilingual"]

# Core = the thin client: `pip install turinton-rag` gives `turinton_rag.RagClient` and the shared models and
# errors, with no engine, no Elasticsearch, no torch (docs/adr/0005). The engine is the `engine` extra.
dependencies = [
    "pydantic>=2.13",
    "httpx>=0.28",
]

[project.optional-dependencies]
# The engine: everything the retrieval / chat path needs, in-process (`turinton_rag.Rag`) or behind the API.
# Deliberately free of OCR, PDF and torch so that API replicas stay small and start fast.
engine = [
    "pydantic-settings>=2.15",
    "langchain-core>=1.6",
    "langchain-text-splitters>=1.1",
    "langchain-openai>=1.6",
    "elasticsearch[async]>=9.5,<10",
    "redis[hiredis]>=8.1",
    "prometheus-client>=0.26",
    "langdetect>=1.0.9",
]
# Every extra below includes the engine: each one adds something to it.
# HTTP API replica (stateless; no OCR stack).
api = [
    "turinton-rag[engine]",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
]
# Ingestion worker: parsers, OCR, keyword extraction, file watching.
worker = [
    "turinton-rag[engine]",
    "pymupdf>=1.28",
    "pandas>=3.0",
    "tabulate>=0.10",
    "pillow>=12.3",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "scikit-learn>=1.9",
    "easyocr>=1.7.2",
    "torch>=2.14",
    "watchdog>=6.0",
]
# Additional document types (each parser reports a clear error if its extra is missing).
docx = ["turinton-rag[engine]", "python-docx>=1.2"]
xlsx = ["turinton-rag[engine]", "openpyxl>=3.1"]
# Additional chat / embedding providers (OpenAI and Azure OpenAI are built in).
anthropic = ["turinton-rag[engine]", "langchain-anthropic>=1.7"]
google = ["turinton-rag[engine]", "langchain-google-genai>=4.4"]
ollama = ["turinton-rag[engine]", "langchain-ollama>=1.1"]
# Self-hosted models (no API key): the `huggingface` embedding provider and the `cross-encoder` reranker.
local = [
    "turinton-rag[engine]",
    "transformers>=4.50",
    "torch>=2.14",
]
# Model Context Protocol server.
mcp = ["turinton-rag[engine]", "mcp>=2.3"]
cli = ["turinton-rag[engine]", "typer>=0.27"]
all = [
    "turinton-rag[engine,api,worker,docx,xlsx,anthropic,google,ollama,local,mcp,cli]",
]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "fakeredis>=2.39",
    "ruff>=0.16",
    "mypy>=2.4",
    "psutil>=7.0",  # scripts/benchmark.py
    "import-linter>=2.1",  # architecture contracts (tests/architecture, CI)
    "griffe>=1.5",  # public-API diff against the last release (CI)
]

[project.scripts]
rag = "src.cli.app:app"
rag-api = "src.api.main:run"
rag-worker = "src.worker:main"
rag-mcp = "src.mcp_server.main:main"

[tool.setuptools.packages.find]
include = ["src*", "turinton_rag*"]

[tool.setuptools.package-data]
turinton_rag = ["py.typed"]

# --- Architecture contracts (docs/framework.md, section 2; docs/adr/0002) ----------------------------------
# Run with `lint-imports`; enforced in CI and by tests/architecture/. Type-checking-only imports create no
# runtime coupling and are not counted.
[tool.importlinter]
root_packages = ["src", "turinton_rag"]
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layered architecture: dependencies point inward"
type = "layers"
layers = [
    "turinton_rag.embedded | turinton_rag.extend | turinton_rag.testing",
    "src.api | src.cli | src.worker",
    "src.mcp_server | src.evaluation",
    "src.application",
    "src.core.container",
    "src.core.bootstrap",
    "src.chat",
    "src.retrieval | src.ingestion",
    "src.indexing | src.jobs | src.chunking | src.parsing | src.models",
    "src.runtime",
    "src.core.registry",
    "src.ports",
    "src.core.config",
    "src.core.specs | src.core.kinds",
    "src.contracts",
    "src.core.types | src.core.errors | src.core.logger",
]

