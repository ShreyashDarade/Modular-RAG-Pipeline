name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU-only torch: the default Linux wheel drags in multi-GB CUDA libraries the tests never use.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  EXTRAS: api,worker,docx,xlsx,mcp,cli,anthropic,google,ollama,local,dev

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install torch torchvision --index-url "$TORCH_INDEX"
      - run: pip install -e ".[$EXTRAS]"
      - run: ruff check src tests scripts ai_rag_info
      - run: ruff format --check src tests scripts ai_rag_info
      - run: mypy src ai_rag_info   # ai_rag_info (the public SDK) is held to strict typing, see pyproject.toml
      # Architecture as code (docs/framework.md): layering, third-party confinement, thin-client purity.
      - run: lint-imports

  api-compat:
    name: Public API compatibility (griffe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # griffe diffs against the latest release tag, so it needs history and tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install griffe
      - name: Compare ai_rag_info with the latest release tag
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "No release tag yet: nothing to compare against (tests/sdk/api_surface.txt still guards the surface)."
          else
            griffe check ai_rag_info --search . --against "$tag"
          fi

  packaging:
    name: Thin install (wheel in a clean virtualenv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv pytest pytest-asyncio httpx pydantic
      # --noconftest: the shared conftest imports the engine's test fixtures, which this job does not install
      - run: pytest tests/sdk/test_packaging.py -q -m packaging --noconftest -p no:cacheprovider

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install torch torchvision --index-url "$TORCH_INDEX"
      - run: pip install -e ".[$EXTRAS]"
      - run: pytest tests/unit tests/architecture tests/contract tests/conformance tests/sdk/test_facade.py tests/sdk/test_http_backend.py tests/sdk/test_api_surface.py -q -m 'not packaging'

  integration:
    name: Integration tests (Elasticsearch + Redis)
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RAG_TEST_ES_URL: http://localhost:9200
      RAG_TEST_REDIS_URL: redis://localhost:6379/5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install torch torchvision --index-url "$TORCH_INDEX"
      - run: pip install -e ".[$EXTRAS]"
      # Real-weights tests for the local reranker/embedder skip themselves unless the models are cached.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-test-models-v1
      - run: >-
          python -c "from huggingface_hub import snapshot_download as d;
          [d(r) for r in ('cross-encoder/ms-marco-MiniLM-L6-v2', 'BAAI/bge-small-en-v1.5')]"
      # OCR tests skip themselves unless EasyOCR weights are present; mount them via RAG_TEST_OCR_MODELS to run them.
      - run: pytest tests/integration tests/sdk -q -m 'not packaging'   # tests/sdk includes the embedded-vs-HTTP parity suite
